# Included in every location: nginx drops server-level add_header lines in any location that
# sets its own headers, so they must be repeated where Cache-Control is added.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# style-src needs 'unsafe-inline' for React/Recharts inline style attributes; scripts stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Enable HSTS once the site is served over HTTPS (e.g. behind a TLS-terminating load balancer):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
