# Serves the React SPA and proxies /api to the Flask backend (Gunicorn on backend:8000).

# Keep the scheme the client actually used: with the TLS override, Caddy terminates HTTPS and
# sends X-Forwarded-Proto: https; without it, nginx is the edge and $scheme is right.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Docker's embedded DNS: re-resolve "backend" so scaling or recreating it is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream accesshub_api {
    zone accesshub_api 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    # Liveness for the container healthcheck / load balancer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://accesshub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The audit CSV is streamed; pass chunks through as they arrive.
    location = /api/audit/export.csv {
        proxy_pass http://accesshub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite emits content-hashed file names, so assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else is the SPA: unknown paths fall back to index.html for client-side routing.
    # index.html itself must always be revalidated so a new deploy is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
