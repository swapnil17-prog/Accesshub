# HTTPS for the production stack. Use together with the main file:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
#
# Caddy becomes the public entry point on 80/443 (automatic Let's Encrypt certificates, HTTP ->
# HTTPS redirect, HSTS) and forwards to nginx, which is no longer published on the host.
# Set SITE_ADDRESS (your domain) in .env; the domain's DNS must point at this server.

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"  # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to your domain in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # certificates and keys: keep this volume
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  frontend:
    ports: !reset []  # only Caddy is exposed

  backend:
    environment:
      PROXY_FIX_HOPS: "2"  # two trusted proxies now: Caddy, then nginx

volumes:
  caddy_data:
  caddy_config:
