# Local development stack. Production lives in docker-compose.prod.yml (Phase 8).
#   docker compose up --build
#   frontend: http://localhost:5173   api: http://localhost:5000/api/health   mailhog: http://localhost:8025

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: accesshub
      POSTGRES_PASSWORD: accesshub
      POSTGRES_DB: accesshub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate accesshub_test database on first start.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesshub -d accesshub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      FLASK_APP: wsgi.py
      FLASK_CONFIG: development
      DATABASE_URL: postgresql+psycopg://accesshub:accesshub@postgres:5432/accesshub
      TEST_DATABASE_URL: postgresql+psycopg://accesshub:accesshub@postgres:5432/accesshub_test
      MAIL_SERVER: mailhog
      MAIL_PORT: "1025"
      FRONTEND_URL: http://localhost:5173
      RUN_SCHEDULER: "0"
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  frontend_node_modules:
